function weightedPick(rng,tid,kind){

}
function genEvents(m,rng){
  const sh=T[m.home].str,sa=T[m.away].str;
  const gh=Math.min(5,poisson(rng,Math.max(.3,.5+.45*sh-.2*sa+.2)));
  const ga=Math.min(5,poisson(rng,Math.max(.3,.5+.45*sa-.2*sh)));
  const ev=[];
  for(let i=0;i<gh;i++)ev.push({min:1+Math.floor(rng()*90),type:'goal',team:m.home,player:weightedPick(rng,m.home,'goal')});
  for(let i=0;i<ga;i++)ev.push({min:1+Math.floor(rng()*90),type:'goal',team:m.away,player:weightedPick(rng,m.away,'goal')});
  [m.home,m.away].forEach(tid=>{
    const ny=(rng()<.42?1:0)+(rng()<.2?1:0)+(rng()<.06?1:0);
    for(let i=0;i<ny;i++)ev.push({min:3+Math.floor(rng()*87),type:'yellow',team:tid,player:weightedPick(rng,tid,'card')});
    if(rng()<.025)ev.push({min:30+Math.floor(rng()*60),type:'red',team:tid,player:weightedPick(rng,tid,'card')});
  });

}

  matches.filter(m=>m.status==='finished').sort((a,b)=>a.fecha-b.fecha).forEach(m=>{

function computePlayers(matches){
  const by={};
  PLAYERS.forEach(p=>by[p.id]={...p,goals:0,yellow:0,red:0,pj:0,cards:[],gbf:Array(22).fill(0)});
  const played=matches.filter(m=>m.status==='finished'||m.status==='live');
  const cnt={};
  played.forEach(m=>{
    [m.home,m.away].forEach(t=>cnt[t]=(cnt[t]||0)+1);
    m.events.forEach(e=>{
      const p=by[e.player];if(!p)return;
      if(e.type==='goal'){p.goals++;p.gbf[m.fecha-1]++}
      else{p[e.type]++;p.cards.push({fecha:m.fecha,min:e.min,type:e.type,rival:e.team===m.home?m.away:m.home,date:m.date})}
    });
  });
  const lastP={},nextM={};
  TEAMS.forEach(t=>{
    const tm=matches.filter(m=>m.home===t.id||m.away===t.id);
    lastP[t.id]=tm.filter(m=>m.status==='finished'||m.status==='live').sort((a,b)=>b.fecha-a.fecha)[0];
    nextM[t.id]=tm.filter(m=>m.status==='scheduled'||m.status==='suspended').sort((a,b)=>a.fecha-b.fecha)[0];
  });
  Object.values(by).forEach(p=>{
    p.pj=Math.max(0,(cnt[p.teamId]||0)-(hash(p.id)%4===0?1:0));
    const lm=lastP[p.teamId],lf=lm?lm.fecha:0;
    p.cards.sort((a,b)=>b.fecha-a.fecha||b.min-a.min);
    const inLast=p.cards.filter(c=>c.fecha===lf);
    const redLast=inLast.find(c=>c.type==='red');
    const yLast=inLast.filter(c=>c.type==='yellow').length;
    p.next=nextM[p.teamId];p.lastFecha=lf;p.susp=null;
    if(redLast)p.susp={reason:`Tarjeta roja en la Fecha ${lf} (min. ${redLast.min})`,rule:'La roja directa se cumple con 1 fecha de suspensión.'};
    else if(p.yellow>0&&p.yellow%5===0&&yLast>0)p.susp={reason:`Completó ${p.yellow} amarillas (la última en la Fecha ${lf})`,rule:'Cada 5 amarillas acumuladas se cumple 1 fecha de suspensión.'};
    p.cycle=p.yellow===0?0:p.yellow%5===0?(p.susp&&p.susp.reason.startsWith('Completó')?5:0):p.yellow%5;
  });
  return by;
}

function computeH2H(matches,aId,bId){
  const season=matches.filter(m=>m.status==='finished'&&((m.home===aId&&m.away===bId)||(m.home===bId&&m.away===aId)))
    .map(m=>{const [h,a]=scoreOf(m);return {date:m.date,home:m.home,away:m.away,h,a,comp:`Liga Local · Fecha ${m.fecha}`}});
  const rng=mulberry32(hash([aId,bId].sort().join('-')));
  const past=['2026-03-14','2025-10-19','2025-06-08','2024-11-23','2024-05-12','2023-09-30'].map((date,i)=>{
    const h=i%2===0?aId:bId,aw=i%2===0?bId:aId;
    const gh=Math.min(5,poisson(rng,Math.max(.4,.6+.4*T[h].str-.15*T[aw].str+.2)));
    const ga=Math.min(5,poisson(rng,Math.max(.4,.6+.4*T[aw].str-.15*T[h].str)));
    return {date,home:h,away:aw,h:gh,a:ga,comp:'Liga Local'};
  });
  const all=[...season,...past].sort((x,y)=>y.date.localeCompare(x.date));
  const r={aW:0,bW:0,d:0,aG:0,bG:0,list:all};
  all.forEach(x=>{
    const ag=x.home===aId?x.h:x.a,bg=x.home===aId?x.a:x.h;
    r.aG+=ag;r.bG+=bg;
    if(ag>bg)r.aW++;else if(bg>ag)r.bW++;else r.d++;
  });
  return r;
}

    case 'NOTIF_PREF':return {...s,notifPrefs:{...s.notifPrefs,[a.key]:!s.notifPrefs[a.key]}};
    case 'CLOCK':return {...s,clock:!s.clock};
    case 'EVENT':return addEvent(s,a.matchId,a.ev);
    case 'TICK':{
      if(!s.clock)return s;
      const live=s.matches.find(m=>m.id==='LIVE');
      if(!live||live.status!=='live')return s;
      const minute=live.minute+1;
      let next={...s,matches:s.matches.map(m=>m.id==='LIVE'?{...m,minute}:m)};
      const sc=LIVE_SCRIPT[minute];
      if(sc)next=addEvent(next,'LIVE',{min:minute,...sc});
      if(minute>=90){
        next={...next,matches:next.matches.map(m=>m.id==='LIVE'?{...m,status:'finished',minute:90}:m)};
        const fm=next.matches.find(m=>m.id==='LIVE');const [h,aw]=scoreOf(fm);
        next=pushToast(next,{kind:'info',title:'Final del partido',body:`${T[fm.home].name} ${h}–${aw} ${T[fm.away].name}`});
      }
      return next;
    }
    case 'RESET_LIVE':{
      const fresh=JSON.parse(JSON.stringify(INITIAL_LIVE));
      return {...s,matches:s.matches.map(m=>m.id==='LIVE'?fresh:m),notifLog:s.notifLog.filter(n=>!(n.matchId==='LIVE'&&n.kind==='goal'&&n.ts>BOOT))};
    }
    case 'SUSPEND':{
      const m=s.matches.find(x=>x.id===a.id);if(!m)return s;
      const proposals=[3,5,8].map((d,i)=>({date:iso(addDays(pd(m.date),d)),time:['20:00','16:00','20:30'][i]}));
      let next={...s,matches:s.matches.map(x=>x.id===a.id?{...x,status:'suspended',suspension:{reason:a.reason,proposals,done:false}}:x),
        notifLog:[{id:uid(),kind:'susp',title:'Partido suspendido',body:`${T[m.home].name} vs ${T[m.away].name} · ${a.short}`,ts:Date.now(),matchId:m.id},...s.notifLog]};
      if(s.notifPrefs.susp)next=pushToast(next,{kind:'warn',title:'Partido suspendido',body:`${T[m.home].name} vs ${T[m.away].name}`,matchId:m.id});
      return next;
    }
    case 'REPROGRAM':{
      const m=s.matches.find(x=>x.id===a.id);if(!m)return s;
      let next={...s,matches:s.matches.map(x=>x.id===a.id?{...x,status:'scheduled',date:a.date,time:a.time,suspension:{...x.suspension,done:true,prev:{date:x.date,time:x.time}}}:x),
        notifLog:[{id:uid(),kind:'info',title:'Partido reprogramado',body:`${T[m.home].init} vs ${T[m.away].init} · ${fmtLong(a.date)} ${a.time}`,ts:Date.now(),matchId:m.id},...s.notifLog]};
      return pushToast(next,{kind:'success',title:'Partido reprogramado',body:`Nueva fecha: ${fmtLong(a.date)} a las ${a.time}`});
    }
    case 'UNDO_REPROGRAM':{
      return {...s,matches:s.matches.map(x=>x.id===a.id&&x.suspension?{...x,status:'suspended',date:x.suspension.prev?x.suspension.prev.date:x.date,time:x.suspension.prev?x.suspension.prev.time:x.time,suspension:{...x.suspension,done:false}}:x)};
    }
    case 'FREE_UPSERT':{
      const exists=s.freePlayers.some(p=>p.ownerId===a.player.ownerId);
      return {...s,freePlayers:exists?s.freePlayers.map(p=>p.ownerId===a.player.ownerId?{...a.player,id:p.id}:p):[a.player,...s.freePlayers]};
    }
    case 'CHAT':{
      const cur=s.chats[a.playerId]||[];
      return {...s,chats:{...s.chats,[a.playerId]:[...cur,{id:uid(),t:nowHM(),...a.msg}]}};
    }
    default:return s;
  }
}

function haversine(a,b){
  const R=6371,r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);
  const x=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

const POSITIONS=['Delantero','Mediocampista','Defensor','Arquero'];
const AVAIL=['Lun–Vie mañana','Lun–Vie tarde','Lun–Vie noche','Fines de semana'];
const LEVELS=['Liga local','Ligas del interior','Reserva','Sin experiencia federada'];
const ZONES=['Santa Fe capital','Santo Tomé','Recreo','Sauce Viejo','Esperanza'];
function PublishFree(){
  const {s,dispatch,go,me}=useApp();
  const mine=s.freePlayers.find(p=>p.ownerId===me.id);
  const [f,setF]=useState(()=>mine?{...mine,age:String(mine.age),exp:String(mine.exp)}:{name:me.name,pos:'',age:'',exp:'',level:LEVELS[0],note:'',avail:[],zone:ZONES[0],phone:me.phone||'',email:me.email});
  const [sub,setSub]=useState(false);
  const [done,setDone]=useState(false);
  const set=k=>e=>setF({...f,[k]:e.target.value});
  const age=Number(f.age),exp=Number(f.exp);
  const errs={};
  if(f.name.trim().length<3)errs.name='Ingresá tu nombre.';
  if(!f.pos)errs.pos='Elegí tu posición.';
  if(!f.age||age<15||age>45)errs.age='La edad debe estar entre 15 y 45.';
  if(f.exp===''||exp<0||exp>30)errs.exp='Indicá tus años de experiencia (0 a 30).';
  if(f.avail.length===0)errs.avail='Elegí al menos un momento disponible.';
  if(f.phone.replace(/\D/g,'').length<8)errs.phone='Ingresá un teléfono de al menos 8 dígitos.';
  if(!EMAIL.test(f.email))errs.email='Escribí un email válido.';
  const toggleAvail=a=>setF({...f,avail:f.avail.includes(a)?f.avail.filter(x=>x!==a):[...f.avail,a]});
  const submit=e=>{
    e.preventDefault();setSub(true);if(Object.keys(errs).length)return;
    dispatch({type:'FREE_UPSERT',player:{id:'fp'+uid(),ownerId:me.id,name:f.name.trim(),pos:f.pos,age,exp,level:f.level,note:f.note.trim()||'Sin descripción.',avail:f.avail,zone:f.zone,phone:f.phone.trim(),email:f.email.trim(),ts:Date.now()}});
    dispatch({type:'TOAST',toast:{kind:'success',title:mine?'Publicación actualizada':'Perfil publicado',body:'Ya aparecés en la bolsa de pases.'}});
    setDone(true);
  };
  if(done)return html`<${Page} title="Publicación lista" sub="Bolsa de pases" nav=${NAV_PLAYERS}>
    <div className="card p-6 flex flex-col items-center text-center gap-3" role="status"><span className="w-16 h-16 rounded-full bg-okbg text-ok flex items-center justify-center"><${Icon} n="check" s=${32}/></span>
      <h2 className="text-[22px] font-bold">¡Tu perfil ya está publicado!</h2><p className="text-[14.5px] text-mute">Los clubes pueden encontrarte por posición y edad, y escribirte desde la app.</p>
      <${Btn} full icon="search" onClick=${()=>go('cu20',{fq:f.name.split(' ')[0],fpos:'',fmin:15,fmax:45})}>Ver mi publicación<//><${Btn} v="ghost" full onClick=${()=>setDone(false)}>Editar de nuevo<//></div>
  <//>`;
  return html`<${Page} title="Publicar perfil" sub="Bolsa de pases · jugador libre" nav=${NAV_PLAYERS}>
    <form className="flex flex-col gap-4" onSubmit=${submit} noValidate>
      ${mine?html`<div className="alert alert-gold"><${Icon} n="info" s=${20}/><span>Ya tenés una publicación. Al guardar la vamos a actualizar.</span></div>`:null}
      <div className="card p-5 flex flex-col gap-4">
        <${Field} id="fp-name" label="Nombre" icon="user" value=${f.name} onChange=${set('name')} error=${sub?errs.name:''}/>
        <fieldset><legend className="lbl">Posición</legend><div className="grid grid-cols-2 gap-2">${POSITIONS.map(p=>html`<button type="button" key=${p} aria-pressed=${f.pos===p?'true':'false'} onClick=${()=>setF({...f,pos:p})} className=${cx('rounded-xl border-2 py-3 font-bold text-[14px]',f.pos===p?'border-pri bg-prisoft text-brand':'border-line bg-surface')}>${p}</button>`)}</div>${sub&&errs.pos?html`<span className="err" role="alert">${errs.pos}</span>`:null}</fieldset>
        <div className="grid grid-cols-2 gap-3"><${Field} id="fp-age" label="Edad" type="number" inputMode="numeric" min="15" max="45" value=${f.age} onChange=${set('age')} placeholder="24" error=${sub?errs.age:''}/><${Field} id="fp-exp" label="Años de experiencia" type="number" inputMode="numeric" min="0" max="30" value=${f.exp} onChange=${set('exp')} placeholder="5" error=${sub?errs.exp:''}/></div>
        <div><label className="lbl" htmlFor="fp-level">Nivel de experiencia</label><div className="inp"><select id="fp-level" value=${f.level} onChange=${set('level')}>${LEVELS.map(l=>html`<option key=${l}>${l}</option>`)}</select></div></div>
        <div><label className="lbl" htmlFor="fp-note">Sobre vos <span className="font-medium">(${f.note.length}/200)</span></label><div className="inp"><textarea id="fp-note" rows="3" maxLength="200" value=${f.note} onChange=${set('note')} placeholder="Estilo de juego, clubes anteriores, logros…"></textarea></div></div>
      </div>
      <div className="card p-5 flex flex-col gap-4">
        <fieldset><legend className="lbl">Disponibilidad</legend><div className="flex flex-wrap gap-2">${AVAIL.map(a=>html`<button type="button" key=${a} aria-pressed=${f.avail.includes(a)?'true':'false'} onClick=${()=>toggleAvail(a)} className=${cx('pill',f.avail.includes(a)&&'on')}>${f.avail.includes(a)?'✓ ':''}${a}</button>`)}</div>${sub&&errs.avail?html`<span className="err" role="alert">${errs.avail}</span>`:null}</fieldset>
        <div><label className="lbl" htmlFor="fp-zone">Zona</label><div className="inp"><select id="fp-zone" value=${f.zone} onChange=${set('zone')}>${ZONES.map(z=>html`<option key=${z}>${z}</option>`)}</select></div></div>
        <${Field} id="fp-phone" label="Teléfono / WhatsApp" icon="phone" type="tel" value=${f.phone} onChange=${set('phone')} placeholder="342 555-0000" error=${sub?errs.phone:''}/>
        <${Field} id="fp-email" label="Email de contacto" icon="mail" type="email" value=${f.email} onChange=${set('email')} error=${sub?errs.email:''}/>
      </div>
      <section aria-label="Vista previa"><div className="text-[12px] font-bold uppercase tracking-widest text-mute mb-2">Así te ven los clubes</div><${FreeCard} p=${{...f,age:age||'–',exp:exp||0,id:'preview'}} preview/></section>
      <${Btn} type="submit" full icon="send">${mine?'Actualizar publicación':'Publicar perfil'}<//>
    </form>
  <//>`;
}

      <div className="grid grid-cols-2 gap-3"><label className="text-[12px] text-mute font-semibold">Mínima<input id="fs-min" type="range" min="15" max="45" value=${min} onChange=${e=>{const v=Number(e.target.value);setUI({fmin:Math.min(v,max)})}} aria-label="Edad mínima"/></label>
        <label className="text-[12px] text-mute font-semibold">Máxima<input id="fs-max" type="range" min="15" max="45" value=${max} onChange=${e=>{const v=Number(e.target.value);setUI({fmax:Math.max(v,min)})}} aria-label="Edad máxima"/></label></div></div>
    <div className="flex items-center justify-between"><span className="text-[14px] text-mute"><b className="text-ink">${list.length}</b> ${list.length===1?'jugador':'jugadores'}</span>${filtered?html`<button className="text-[13.5px] font-bold text-brand underline" onClick=${clear}>Limpiar filtros</button>`:null}</div>
    ${list.length===0?html`<${Empty} icon="users" title="Sin resultados">Probá con otra posición o ampliá el rango de edad.<${Btn} className="mt-3" sm onClick=${clear}>Limpiar filtros<//><//>`:null}
    ${list.map(p=>html`<${FreeCard} key=${p.id} p=${p} saved=${saved.includes(p.id)} onSave=${()=>setUI({saved:saved.includes(p.id)?saved.filter(x=>x!==p.id):[...saved,p.id]})} onContact=${()=>go('cu21',{chatPlayer:p.id})}/>`)}
  <//>`;
}
/* CU_021 · Chat club-jugador */
const REPLIES={
  club:['¡Hola! Gracias por escribirme, me interesa mucho.','Tengo disponibilidad martes y jueves por la tarde. ¿A qué hora sería?','Perfecto, ahí estaré. ¿Dónde entrenan?','Genial, llevo botines y documento. ¡Gracias!'],
  player:['Hola, vimos tu perfil y nos gustó. ¿Seguís libre?','Entrenamos martes y jueves a las 19 h. ¿Podés venir esta semana?','Excelente. Te esperamos en el estadio, preguntá por el DT.','Dale, cualquier cosa avisanos por acá.'],
};
const QUICK={
  club:[['text','Invitar a prueba','Te invitamos a una práctica de prueba esta semana. ¿Podés venir?'],['text','Proponer reunión','¿Te parece si nos juntamos 15 minutos para conversar el proyecto?'],['proposal','Propuesta formal','']],
  player:[['text','Confirmar interés','Sigo interesado/a. ¿Podemos coordinar una práctica de prueba?'],['text','Consultar condiciones','¿Qué condiciones ofrece el club? ¿Hay viáticos o seguro?'],['text','Enviar CV','Te comparto mi trayectoria resumida: mirá mi publicación en la bolsa de pases.']],
};
function Chat(){
  const {s,dispatch}=useApp();
  const pid=s.ui.chatPlayer;const as=s.ui.chatAs;
  const p=s.freePlayers.find(x=>x.id===pid)||s.freePlayers[0];
  const msgs=s.chats[p.id]||[];
  const [txt,setTxt]=useState('');
  const boxRef=useRef(null);
  const typing=s.ui.typing===p.id;
  useEffect(()=>{const b=boxRef.current;if(b)b.scrollTop=b.scrollHeight},[msgs.length,typing,p.id]);
  const other=as==='club'?'player':'club';
  const send=(kind,text)=>{
    const msg=kind==='proposal'?{from:as,kind:'proposal',text:'Propuesta de fichaje',data:{club:'Deportivo Central',detail:'Prueba de 2 prácticas (martes y jueves, 19 h) y, si resulta, contrato por el resto de la temporada.'}}:{from:as,kind:'text',text};
    dispatch({type:'CHAT',playerId:p.id,msg});
    const n=msgs.filter(m=>m.from===other).length;
    dispatch({type:'UI',patch:{typing:p.id}});
    setTimeout(()=>{dispatch({type:'CHAT',playerId:p.id,msg:{from:other,kind:'text',text:kind==='proposal'?(as==='club'?'¡Gracias por la propuesta! La reviso y te confirmo hoy.':'Recibimos tu propuesta, la analizamos y te respondemos.'):REPLIES[other][n%REPLIES[other].length]}});dispatch({type:'UI',patch:{typing:''}})},1500);
  };
  const submit=e=>{e.preventDefault();const t=txt.trim();if(!t)return;send('text',t);setTxt('')};
  const mineSide=as;
  return html`<${Page} title="Mensajes" sub="Contacto club · jugador" nav=${NAV_PLAYERS}>
    <${Seg} label="Escribir como" value=${as} onChange=${v=>dispatch({type:'UI',patch:{chatAs:v}})} options=${[{id:'club',label:'Como Club (Deportivo Central)'},{id:'player',label:'Como jugador'}]}/>
    <div className="inp"><${Icon} n="users" s=${18} className="text-mute"/><select id="chat-player" aria-label="Conversación con" value=${p.id} onChange=${e=>dispatch({type:'UI',patch:{chatPlayer:e.target.value}})}>${s.freePlayers.map(x=>html`<option key=${x.id} value=${x.id}>${x.name} · ${x.pos}</option>`)}</select></div>
    <section className="card flex flex-col overflow-hidden" aria-label=${'Chat con '+p.name}>
      <div className="p-3 flex items-center gap-3 border-b border-line bg-surface2"><${Avatar} name=${p.name} size=${40}/><div className="min-w-0 flex-1"><div className="font-bold leading-tight">${as==='club'?p.name:'Deportivo Central'}</div><div className="text-[12.5px] text-mute">${as==='club'?`${p.pos} · ${p.age} años · ${p.zone}`:'Club · Fecha 14'}</div></div>${as==='club'?html`<span className="chip chip-ok">Libre</span>`:html`<span className="chip chip-pri">Club</span>`}</div>
      <div ref=${boxRef} className="p-3 flex flex-col gap-2.5 overflow-y-auto" style=${{minHeight:260,maxHeight:380}} role="log" aria-live="polite">
        ${msgs.length===0?html`<div className="m-auto text-center text-mute text-[14px] py-8">Escribí el primer mensaje para iniciar la conversación.</div>`:null}
        ${msgs.map(m=>{const me=m.from===mineSide;return html`<div key=${m.id} className=${cx('flex flex-col',me?'items-end':'items-start')}>
          ${m.kind==='proposal'?html`<div className=${cx('bubble',me?'bubble-me':'bubble-them')} style=${{width:'88%'}}><div className="flex items-center gap-2 font-bold"><${Icon} n="shield" s=${16}/>${m.text}</div><div className="text-[13.5px] mt-1.5 opacity-95">${m.data.club}: ${m.data.detail}</div><span className="chip chip-gold mt-2">Enviada</span></div>`
            :html`<div className=${cx('bubble',me?'bubble-me':'bubble-them')}>${m.text}</div>`}
          <span className="text-[11px] text-mute mt-1 px-1 tnum">${m.t}${me?' · ✓✓':''}</span></div>`})}
        ${typing?html`<div className="flex items-start"><div className="bubble bubble-them typing" aria-label="Escribiendo"><span></span><span></span><span></span></div></div>`:null}
      </div>
      <div className="px-3 pt-2 pb-1 flex gap-2 overflow-x-auto" style=${{scrollbarWidth:'none'}}>${QUICK[as].map(([k,l,t])=>html`<button key=${l} type="button" className="pill" onClick=${()=>send(k,t)}>${l}</button>`)}</div>
      <form onSubmit=${submit} className="p-3 flex gap-2 items-center"><div className="inp flex-1"><input id="chat-input" aria-label="Escribir mensaje" placeholder="Escribí un mensaje…" value=${txt} onChange=${e=>setTxt(e.target.value)} autoComplete="off"/></div>
        <button type="submit" className="btn btn-pri" style=${{minWidth:50,padding:'12px'}} aria-label="Enviar mensaje" disabled=${!txt.trim()}><${Icon} n="send" s=${20}/></button></form>
    </section>
  <//>`;
}

   App: pantallas, contexto y arranque
   ============================================================ */
const SCREENS={
  home:Home,profile:Profile,
  cu01:Register,cu02:Login,cu03:Recover,cu04:EditProfile,cu05:Favorites,cu06:Roles,
  cu07:Live,cu08:Standings,cu09:Fixture,cu10:History,cu11:H2H,cu12:GoalPush,cu13:Suspension,
  cu14:Venues,cu15:Directions,cu16:PlayerStats,cu17:Scorers,cu18:PlayerCards,cu19:PublishFree,cu20:SearchFree,cu21:Chat,
};
function App(){
  const [s,dispatch]=useReducer(reducer,undefined,initState);
  const d=useMemo(()=>({table:computeTable(s.matches),players:computePlayers(s.matches)}),[s.matches]);
  const go=useCallback((screen,ui)=>{dispatch({type:'NAV',screen,ui});try{window.scrollTo(0,0)}catch(e){}},[]);
  const back=useCallback(()=>{dispatch({type:'BACK'});try{window.scrollTo(0,0)}catch(e){}},[]);
  useEffect(()=>{const id=setInterval(()=>dispatch({type:'TICK'}),6000);return()=>clearInterval(id)},[]);
  const me=s.users.find(u=>u.id===s.userId)||s.users[0];
  const ctx={s,dispatch,go,back,d,me};
  const Screen=SCREENS[s.screen]||Home;
  const showNav=!AUTH_SCREENS.includes(s.screen);
  return html`<${Ctx.Provider} value=${ctx}>
    <div className="app">
      <${DemoBar}/>
      <${Toasts}/>
      <${Screen} key=${s.screen}/>
      ${showNav?html`<${BottomNav}/>`:null}
    </div>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
